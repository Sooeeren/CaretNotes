# .deb, .rpm and Arch packages from the Flutter Linux bundle; see packaging/linux/build.sh.
name: caretnotes
arch: amd64
platform: linux
version: ${VERSION}
release: 1
maintainer: Sooeeren <sooeeren@proton.me>
description: Handwritten and typed notes for pen and touch.
homepage: https://github.com/Sooeeren/CaretNotes
license: MIT
section: editors
contents:
  - src: build/linux/x64/release/bundle/
    dst: /usr/lib/caretnotes
    type: tree
  # tells the in-app updater how it was installed (rewritten per package by build.sh)
  - src: build/linux/install_kind
    dst: /usr/lib/caretnotes/install_kind
  - src: /usr/lib/caretnotes/caret_notes
    dst: /usr/bin/caretnotes
    type: symlink
  - src: packaging/linux/dev.caretnotes.caret_notes.desktop
    dst: /usr/share/applications/dev.caretnotes.caret_notes.desktop
  - src: packaging/linux/dev.caretnotes.caret_notes.metainfo.xml
    dst: /usr/share/metainfo/dev.caretnotes.caret_notes.metainfo.xml
  - src: packaging/linux/icons/64x64/caretnotes.png
    dst: /usr/share/icons/hicolor/64x64/apps/dev.caretnotes.caret_notes.png
  - src: packaging/linux/icons/128x128/caretnotes.png
    dst: /usr/share/icons/hicolor/128x128/apps/dev.caretnotes.caret_notes.png
  - src: packaging/linux/icons/256x256/caretnotes.png
    dst: /usr/share/icons/hicolor/256x256/apps/dev.caretnotes.caret_notes.png
  - src: packaging/linux/icons/512x512/caretnotes.png
    dst: /usr/share/icons/hicolor/512x512/apps/dev.caretnotes.caret_notes.png
overrides:
  deb:
    depends: [libgtk-3-0 | libgtk-3-0t64, libx11-6, libxi6, libstdc++6]
    recommends: [fonts-dejavu-core]
  rpm:
    depends: [gtk3, libX11, libXi, libstdc++]
    recommends: [dejavu-sans-fonts, dejavu-sans-mono-fonts]
  archlinux:
    depends: [gtk3, libx11, libxi, gcc-libs]
    suggests: ['ttf-dejavu: fonts for PDF export']
