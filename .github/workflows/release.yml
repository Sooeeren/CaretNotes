name: Release

# Builds every download and attaches it to the GitHub release:
#   Windows  CaretNotes-Setup-<v>.exe (installer), CaretNotes-<v>-portable.exe
#   Linux    caretnotes_<v>_amd64.deb, caretnotes-<v>-1.x86_64.rpm,
#            caretnotes-<v>-1-x86_64.pkg.tar.zst (Arch), CaretNotes-<v>-x86_64.AppImage
#   Android  CaretNotes-<v>.apk
# The in-app updater finds these by name (lib/core/update/update_check.dart).
# Push a tag (git tag v0.2.0 && git push origin v0.2.0) to build and publish; run it by
# hand with publish off to only build (the files are then under the run's artifacts).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release (off: only build the files)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          V=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml | tr -d '\r')
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec version $V"; exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build windows --release
      - run: choco install innosetup -y --no-progress
      - run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -Version ${{ needs.version.outputs.v }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            build/installer/CaretNotes-Setup-*.exe
            build/installer/CaretNotes-*-portable.exe

  linux:
    needs: version
    runs-on: ubuntu-22.04 # older glibc: the packages also run on older distros
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libx11-dev libxi-dev file
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update -q
          sudo apt-get install -y -q nfpm
          sudo wget -q -O /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build linux --release
      - run: bash packaging/linux/build.sh ${{ needs.version.outputs.v }} out
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/*

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Same signing key as the earlier APKs, so Android installs the update over them.
      # Without it the APK is skipped (build it locally and upload it), since a differently
      # signed APK can't update an installed CaretNotes.
      - name: Signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE secret not set: no APK built (see docs/BUILDING.md)"
          fi
      - if: steps.key.outputs.ok == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - if: steps.key.outputs.ok == 'true'
        run: |
          flutter build apk --release
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/CaretNotes-${{ needs.version.outputs.v }}.apk"
      - if: steps.key.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*

  release:
    needs: [version, windows, linux, android]
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.v }}
        run: |
          ls -lh out
          NOTES="docs/release-notes/v$V.md"
          [ -f "$NOTES" ] || { echo "::error::$NOTES is missing"; exit 1; }
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" out/* --clobber
          else
            gh release create "v$V" out/* --title "CaretNotes $V" --notes-file "$NOTES" --target "$GITHUB_SHA"
          fi
